name: Build Android AAB (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev cmake \
            libffi-dev libssl-dev \
            libltdl-dev

      - name: Install buildozer and Cython
        run: pip install 'buildozer>=1.5' 'cython>=3'

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-aab-v1-${{ hashFiles('buildozer.spec', 'custom_recipes/**') }}
          restore-keys: |
            buildozer-aab-v1-

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed release AAB
        shell: bash
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/upload.keystore
          P4A_RELEASE_KEYALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          buildozer -v android release 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aab-build-log-${{ github.sha }}
          path: build.log

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: retris-aab-${{ github.sha }}
          path: bin/*.aab
          retention-days: 30
